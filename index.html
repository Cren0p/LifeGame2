<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생게임 스코어보드</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/Cren0p/LifeGame/main/Favicon.webp">
<style>
:root {
  --bg:#080810; --surface:#0f0f1a; --card:#141428;
  --border:#1e1e34; --text:#e4e4f4; --muted:#52527a;
  --font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}

/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:#FFA502;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.wrap{max-width:1260px;margin:0 auto;padding:28px 20px 60px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:1.5rem;font-weight:800;}
.page-title span{background:linear-gradient(135deg,#FFA502,#E879F9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.badge{font-size:.7rem;background:var(--border);color:var(--muted);padding:4px 11px;border-radius:20px;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#2ED573;display:inline-block;margin-right:5px;}
.conn-dot.off{background:#FF4757;}

.phase-nav{display:flex;border:1px solid var(--border);overflow:hidden;margin-bottom:28px;}
.pnav{flex:1;padding:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;background:transparent;border:none;color:var(--muted);font-family:var(--font);transition:all .2s;position:relative;}
.pnav.active{background:var(--card);color:var(--text);}
.pnav.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FFA502,#E879F9);}
.pnav:not(:last-child){border-right:1px solid var(--border);}

.slabel{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}

.mcard{width:100%;cursor:grab;user-select:none;transition:all .18s;display:flex;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border:2px solid transparent;background:var(--card);}
.mcard:active{cursor:grabbing;}
.mcard:hover{border-color:#FFA502;}
.mcard.mcard-s{border-color:#FFA502;box-shadow:0 0 0 3px rgba(255,165,2,.25);}
.mcard-img{width:52px;height:52px;border-radius:4px;object-fit:cover;display:block;flex-shrink:0;}
.mcard-img-ph{width:52px;height:52px;border-radius:4px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.mcard-name{font-size:1.05rem;font-weight:500;color:var(--text);}
.mcard.mcard-s .mcard-name{color:#FFA502;}

/* 팀 3개 가로 배열 */
.setup-teams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
@media(max-width:900px){.setup-teams{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.setup-teams{grid-template-columns:1fr;}}
.sc{background:var(--surface);border:1px solid var(--border);padding:12px;cursor:default;transition:border-color .2s;}
.sc.drop{border-color:rgba(255,255,255,.35);box-shadow:0 0 0 2px rgba(255,255,255,.1);}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.color-pick{width:22px;height:22px;flex-shrink:0;border:2px solid rgba(255,255,255,.2);cursor:pointer;padding:0;background:none;}
.color-pick::-webkit-color-swatch-wrapper{padding:0;}
.color-pick::-webkit-color-swatch{border:none;}
.tni{background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:.85rem;font-weight:800;flex:1;outline:none;min-width:0;}
.cnt{font-size:.68rem;color:var(--muted);flex-shrink:0;}

/* 슬롯 */
.slots{display:flex;flex-direction:column;gap:6px;}
.slot-item{display:flex;align-items:center;gap:8px;}
.slot-num{font-size:.6rem;font-weight:700;color:var(--muted);width:12px;text-align:right;flex-shrink:0;}
.slot-card{flex:1;display:flex;flex-direction:row;align-items:center;gap:10px;padding:0 10px;border:2px solid rgba(255,255,255,.2);cursor:grab;transition:all .15s;position:relative;height:66px;box-sizing:border-box;}
.slot-card:active{cursor:grabbing;}
.slot-card:hover{opacity:.8;}
.slot-card-img{width:46px;height:46px;border-radius:3px;object-fit:cover;flex-shrink:0;}
.slot-card-name{font-size:1.05rem;font-weight:500;}
.slot-card-x{display:none;}
.slot-empty{flex:1;padding:0 10px;background:var(--card);border:2px dashed rgba(255,255,255,.2);color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;height:66px;box-sizing:border-box;transition:border-color .15s,background .15s;}
.slot-empty.drag-over{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.04);}
.slot-card.drag-over{border-color:rgba(255,255,255,.8) !important;box-shadow:0 0 0 3px rgba(255,255,255,.15) !important;}
.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--surface);border:1px dashed rgba(255,255,255,.15);padding:14px;margin-bottom:24px;min-height:120px;}
.pool.drag-over{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.03);}

.slot-legend{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.sleg{font-size:.75rem;color:var(--muted);}
.setup-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border:1px solid var(--border);}

.btn{padding:8px 18px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:.82rem;transition:all .18s;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--muted);}
.btn-start{background:linear-gradient(135deg,#FFA502,#E879F9);color:#fff;margin-left:auto;padding:9px 26px;font-size:.88rem;}
.btn-start:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(255,165,2,.35);}
.btn-start:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-danger{background:transparent;border:1px solid #ff475722;color:#FF4757;}
.btn-danger:hover{background:#ff47570f;}
.btn-end{background:linear-gradient(135deg,#ff4757,#c0392b);color:#fff;}
.btn-end:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(255,71,87,.4);}
.btn-resume{background:linear-gradient(135deg,#2ED573,#7effa8);color:#000;}
.btn-resume:hover{transform:translateY(-1px);}
.btn-sm{padding:5px 12px;font-size:.75rem;}
.ended-badge{display:inline-flex;align-items:center;gap:6px;background:#ff47571a;border:1px solid #ff475744;color:#ff6b7a;font-size:.75rem;font-weight:700;padding:4px 12px;letter-spacing:.05em;}

.game-top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.game-top h2{font-size:1rem;font-weight:700;color:var(--muted);flex:1;}
.rounds-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:1100px){.rounds-wrap{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.rounds-wrap{grid-template-columns:1fr;}}
.round-col{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.round-header{padding:12px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.round-title{font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
.btn-toggle-round{margin-left:auto;padding:3px 10px;font-size:.7rem;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0;}
.btn-toggle-round.active{background:#ff47571a;border-color:#ff475744;color:#ff8a93;}
.btn-toggle-round:hover{border-color:var(--muted);color:var(--text);}
.round-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px;}
.prow{background:var(--card);border:1px solid var(--border);padding:10px 12px;}
.prow-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.prow-rank{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:900;flex-shrink:0;}
.prow-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.12);}

.pr1{background:#FFD700;color:#000;} .pr2{background:#B8B8B8;color:#000;} .pr3{background:#CD7F32;color:#fff;} .pr4{background:#3a3a3a;color:#fff;}
.prow-name{font-size:1.15rem;font-weight:500;flex:1;}
.prow-team{font-size:.65rem;color:var(--muted);}
.prow-money{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto;flex-shrink:0;}
.prow-name-money{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.inp-wrap{display:flex;align-items:center;gap:4px;}
.ni{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 7px;font-size:.78rem;font-family:var(--font);width:55px;text-align:right;-moz-appearance:textfield;}
.ni::-webkit-inner-spin-button,.ni::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.ni:focus{outline:none;border-color:var(--muted);}
.ni-suffix{font-size:.78rem;color:var(--muted);margin-right:4px;flex-shrink:0;}
.apbtn{padding:4px 8px;border:none;cursor:pointer;font-weight:800;font-size:.74rem;font-family:var(--font);transition:all .15s;white-space:nowrap;}
.ap-p{background:rgba(46,213,115,.15);color:#2ED573;} .ap-p:hover{background:rgba(46,213,115,.3);}
.ap-m{background:rgba(255,71,87,.15);color:#FF4757;} .ap-m:hover{background:rgba(255,71,87,.3);}
.ap-s{background:rgba(255,165,2,.15);color:#FFA502;} .ap-s:hover{background:rgba(255,165,2,.3);}

.totals-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.tot-card{background:var(--surface);border:1px solid var(--border);padding:12px 14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;}
.tot-rnk{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.tot-name{font-size:1.1rem;font-weight:500;}
.tot-val{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto;}

.log-section{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:20px;}
.log-list{max-height:160px;overflow-y:auto;}
.lrow{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.76rem;}
.lrow:last-child{border-bottom:none;}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lwho{font-weight:700;}
.lsub{color:var(--muted);font-size:.7rem;}
.lamt{font-weight:600;font-size:.86rem;margin-left:auto;}
.lamt.p{color:#2ED573;} .lamt.m{color:#FF4757;} .lamt.s{color:#FFA502;}
.lafter{color:var(--muted);font-size:.7rem;}
.ltime{font-size:.67rem;color:var(--muted);}

.ov-box{background:var(--surface);border:1px solid var(--border);padding:16px 18px;}

/* ── 결과 발표 ── */
.res-section{margin-bottom:28px;}
.res-section-label{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
.res-grid-ind{display:grid;grid-template-columns:repeat(var(--ind-cols,6),1fr);gap:10px;}
.res-grid-team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:900px){.res-grid-ind{grid-template-columns:repeat(4,1fr);}}
@media(max-width:600px){.res-grid-ind{grid-template-columns:repeat(3,1fr);}.res-grid-team{grid-template-columns:repeat(2,1fr);}}

.res-card{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:10px;cursor:pointer;transition:border-color .15s,background .15s;aspect-ratio:1/1;justify-content:center;}
.res-card:hover{border-color:var(--muted);background:var(--card);}
.res-card-img{width:52%;aspect-ratio:1/1;border-radius:4px;object-fit:cover;display:block;flex-shrink:0;}
.res-card-img-ph{width:52%;aspect-ratio:1/1;border-radius:4px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;}
.res-card-img-hidden{width:52%;aspect-ratio:1/1;border-radius:4px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted);flex-shrink:0;}
.res-card-rank-name{display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;}
.res-card-rank{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;flex-shrink:0;}
.res-card-name{font-size:1.3rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-card-money{font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;flex-shrink:0;margin-top:-4px;}
.res-card-hidden{color:rgba(255,255,255,.2);letter-spacing:.05em;}
.res-team-avatars{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;flex-shrink:0;}
.res-team-av{flex:1;aspect-ratio:1/1;border-radius:4px;object-fit:cover;max-width:34%;}
.res-team-av-ph{flex:1;aspect-ratio:1/1;border-radius:4px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.9rem;max-width:34%;}
.res-team-av-hidden{flex:1;aspect-ratio:1/1;border-radius:4px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);max-width:34%;}
.ov-url{font-family:'Consolas',monospace;font-size:.76rem;color:#FFA502;background:var(--card);padding:8px 12px;word-break:break-all;border:1px solid var(--border);display:block;margin:7px 0 10px;}
.ov-hint{font-size:.74rem;color:var(--muted);line-height:1.7;}

.ov-stage{display:inline-flex;flex-direction:column;position:relative;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
.ov-panel{display:none;flex-direction:column;padding:8px;gap:8px;}
.ov-panel.visible{display:flex;}
.ov-ph{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.ov-ph-title{font-size:1.1rem;font-weight:900;color:rgba(255,255,255,.55);letter-spacing:.1em;text-transform:uppercase;}
.ov-pips{display:flex;gap:5px;margin-left:auto;}
.ov-pip{width:18px;height:4px;background:rgba(255,255,255,.18);}
.ov-pip.on{background:rgba(255,255,255,.75);}
.ov-prow{background:rgba(8,8,24,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.08);border-left:4px solid;width:340px;}
.ov-rnum{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;flex-shrink:0;}
.ovr1{background:#FFD700;color:#000;} .ovr2{background:#B8B8B8;color:#000;} .ovr3{background:#CD7F32;color:#fff;} .ovr4{background:#3a3a3a;color:#fff;}
.ov-info{flex:1;min-width:0;overflow:hidden;}
.ov-pname{font-size:1.56rem;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-pmoney{font-size:1.68rem;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;display:flex;align-items:center;}
.ov-msg-overlay{position:absolute;top:0;right:0;bottom:0;width:58%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.35rem;font-weight:600;color:rgba(255,255,255,.95);line-height:1.6;pointer-events:none;}
/* ── Odometer roller ── */
.fd{display:inline-block;position:relative;overflow:hidden;vertical-align:top;}
.fd-sizer{visibility:hidden;display:block;height:1.15em;line-height:1.15em;font-weight:600;}
.fd-char{position:absolute;top:0;left:0;right:0;height:1.15em;line-height:1.15em;text-align:center;font-weight:600;}
.fd-old-up{animation:fd-out-up .35s ease-out forwards;}
.fd-new-up{animation:fd-in-up .35s ease-out forwards;}
.fd-old-dn{animation:fd-out-dn .35s ease-out forwards;}
.fd-new-dn{animation:fd-in-dn .35s ease-out forwards;}
@keyframes fd-out-up{to{transform:translateY(-110%);}}
@keyframes fd-in-up{from{transform:translateY(110%);}to{transform:translateY(0);}}
@keyframes fd-out-dn{to{transform:translateY(110%);}}
@keyframes fd-in-dn{from{transform:translateY(-110%);}to{transform:translateY(0);}}
/* ── 증감 화살표 ── */
.ov-arrow{font-size:1rem;margin-right:6px;animation:ov-arrow-fade 3s ease-out forwards;}
.ov-arrow-up{color:#2ED573;}
.ov-arrow-dn{color:#FF4757;}
@keyframes ov-arrow-fade{0%,60%{opacity:1;}100%{opacity:0;}}
/* ── 인라인 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--card);border:1px solid var(--border);padding:24px 28px;min-width:280px;max-width:400px;display:flex;flex-direction:column;gap:16px;}
.modal-msg{font-size:.95rem;color:var(--text);line-height:1.6;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}

.ov-final{display:none;flex-direction:column;padding:8px;gap:8px;}
.ov-final.visible{display:flex;}
.ov-fh{display:flex;align-items:center;margin-bottom:2px;}
.ov-fh-title{font-size:1.1rem;font-weight:900;color:rgba(255,255,255,.55);letter-spacing:.1em;text-transform:uppercase;}
.ov-trow{background:rgba(8,8,24,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.08);border-left:4px solid;width:340px;}
.ov-trow-rank{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;flex-shrink:0;}
.ov-trow-info{flex:1;min-width:0;overflow:hidden;}
.ov-trow-members{font-size:1.2rem;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-trow-money{font-size:1.68rem;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
/* ── DRAG & BATCH & STEAL ── */
.slot-card[draggable]{cursor:grab;}
.slot-card[draggable]:active{cursor:grabbing;}
.slot-card.dragging{opacity:.3;pointer-events:none;}
.mcard.dragging{opacity:.3;pointer-events:none;}
.drag-handle{display:none;}
.ap-steal{background:rgba(232,121,249,.15);color:#E879F9;} .ap-steal:hover{background:rgba(232,121,249,.3);}
.batch-row{display:flex;gap:4px;padding:0 0 10px;border-bottom:1px solid var(--border);margin-bottom:6px;align-items:center;}
.batch-row .ni{flex:1;min-width:0;}
.batch-label{font-size:.65rem;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0;letter-spacing:.04em;}
</style>
</head>

    return;
  }
  msg.textContent = 'Firebase 초기화 중...';
});
</script>

const firebaseConfig = {

  databaseURL: "https://lifegame-26c6c-default-rtdb.firebaseio.com",
  projectId: "lifegame-26c6c",
  storageBucket: "lifegame-26c6c.firebasestorage.app",
  messagingSenderId: "723913370465",
  appId: "1:723913370465:web:999650fa0d05a9ad39f320"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const STATE_REF = db.ref('game/state');

function defState() {
  // 팀 구성 고정, 각 멤버는 경기(슬롯) 미배정 상태로 시작
  return {
    phase: 'setup',
    teams: FIXED_TEAMS.map((ft, i) => ({
      id: i,
      name: ft.name,
      color: ft.color,
      // members: [{name, money, gameSlot}] 순서는 드래그로 배정
      members: ft.members.map(name => ({ name, money: 0, gameSlot: null }))
    })),
    unassigned: [], // 고정팀이므로 미배정 없음 (gameSlot 미배정만 존재)
    log: [],
    ended: false,
    hiddenRounds: [false, false, false, false],
    revealState: { ind: Array(MEMBERS.length).fill(false), team: Array(3).fill(false) },
    updatedAt: 0
  };
}

function save() {
  state.updatedAt = Date.now();
  myLastSave = state.updatedAt;
  STATE_REF.set(state);
}

const AVATAR_MAP = {
  '우정잉':'FRIENDSHIPING','캬앙':'KYAANG','깐숙':'KKANSUK','베베리':'BEBERRY',
  '예다':'YEDA','꿈틀':'GGUMTEUL','세나':'SENA','김진솔':'KIMJINSXL',
  '민결희':'MINGYEOLHEE','따린':'DDARIN','단즈':'DANZ','코렛트':'COLLET'
};
const REPO_RAW = 'https://raw.githubusercontent.com/Cren0p/LifeGame/main/';
function getAvatar(name) {
  const key = AVATAR_MAP[name];
  return key ? `${REPO_RAW}${key}.webp` : '';
}

function sanitize(s) {
  if (!s) return defState();
  if (!Array.isArray(s.teams) || s.teams.length !== 3) s.teams = defState().teams;
  s.teams.forEach((t, i) => {
    if (t.members && !Array.isArray(t.members)) {
      t.members = Object.values(t.members).filter(m => m !== null && m !== undefined);
    } else {
      t.members = Array.isArray(t.members) ? t.members.filter(m => m !== null && m !== undefined) : [];
    }
    if (!t.color) t.color = DEF_COLORS[i] || '#888';
    // gameSlot 필드 보정
    t.members.forEach(m => { if (m.gameSlot === undefined) m.gameSlot = null; });
  });
  s.unassigned = [];
  s.log = Array.isArray(s.log) ? s.log : [];
  if (!Array.isArray(s.hiddenRounds) || s.hiddenRounds.length !== NUM_GAMES) s.hiddenRounds = Array(NUM_GAMES).fill(false);
  if (!s.revealState || Array.isArray(s.revealState) || typeof s.revealState !== 'object') {
    s.revealState = { ind: Array(MEMBERS.length).fill(false), team: Array(3).fill(false) };
  }
  if (!Array.isArray(s.revealState.ind) || s.revealState.ind.length !== MEMBERS.length) s.revealState.ind = Array(MEMBERS.length).fill(false);
  if (!Array.isArray(s.revealState.team) || s.revealState.team.length !== 3) s.revealState.team = Array(3).fill(false);
  if (s.ended === undefined) s.ended = false;
  return s;
}
function makeFlipChar(oldCh, newCh, color) {
  const up = parseInt(newCh) > parseInt(oldCh);
  return `<span class="fd" style="color:${color}"><span class="fd-sizer">${newCh}</span><span class="fd-char ${up?'fd-old-up':'fd-old-dn'}">${oldCh}</span><span class="fd-char ${up?'fd-new-up':'fd-new-dn'}">${newCh}</span></span>`;
}
function fmtFlip(newNum, oldNum, color) {
  const ns = fmtD(newNum);
  const os = fmtD(oldNum !== undefined ? oldNum : newNum);
  const maxLen = Math.max(ns.length, os.length);
  const np = ns.padStart(maxLen), op = os.padStart(maxLen);
  const changed = oldNum !== undefined && oldNum !== newNum;
  return np.split('').map((ch, i) => {
    const oc = op[i] || ' ';
    if (changed && /[0-9]/.test(ch) && ch !== oc) return makeFlipChar(oc, ch, color);
    return `<span class="fd" style="color:${color}"><span class="fd-sizer">${ch}</span><span class="fd-char">${ch}</span></span>`;
  }).join('');
}
function getTextColor(hex) {
  // hex → RGB → 상대 휘도 계산, 밝으면 검정 어두우면 흰색
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.35 ? '#000' : '#fff';
}
function fmtD(n) {
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  return sg + '$' + a.toLocaleString('en-US');
}
function fmtShort(n) {
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1000000) return sg + '$' + (a/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (a >= 1000) return sg + '$' + (a/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return sg + '$' + a.toLocaleString('en-US');
}
function teamTotal(t) { return t.members.reduce((s, m) => s + m.money, 0); }
function getTeamRanks() {
  return [...state.teams].map((t, i) => ({ i, tot: teamTotal(t) }))
    .sort((a, b) => b.tot - a.tot)
    .reduce((r, x, ri) => { r[x.i] = ri + 1; return r; }, {});
}
function roundPlayers(round) {
  return state.teams.flatMap((t, ti) => {
    const m = t.members.find(mb => mb.gameSlot === round);
    const mi = m ? t.members.indexOf(m) : -1;
    return m ? [{ name: m.name, money: m.money, teamName: t.name, teamColor: t.color, ti, mi }] : [];
  });
}
function rankPlayers(players) { return [...players].sort((a, b) => b.money - a.money); }
function getMode(ti, mi) { return modes[ti + '_' + mi] || 'delta'; }
function addLog(ti, mname, amount, after, mode) {
  const t = state.teams[ti];
  state.log.unshift({ ti, teamName: t.name, color: t.color, mname, amount, after, mode,
    time: new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) });
  if (state.log.length > 80) state.log.pop();
}

      const av = getAvatar(m.name);

        ...Array.from({length:NUM_GAMES},(_,g)=>`<option value="${g}" ${m.gameSlot===g?'selected':''}>${gameSlotNames[g]}</option>`)

        <div style="flex:1;font-size:.95rem;font-weight:500;">${m.name}</div>

      <div class="sc-head">
        <div style="width:14px;height:14px;border-radius:50%;background:${t.color};flex-shrink:0;"></div>

function renderGame() {

  const roundNames = ['경기 1','경기 2','경기 3','경기 4'];

  const totHtml = state.teams.map((t, i) => {
    const r = teamRanks[i], tot = teamTotal(t);
    return `<div class="tot-card" style="border-top:2px solid ${t.color}">
      <div>
        <div class="tot-rnk" style="color:${rkC[r]}">${rkL[r-1]}</div>
        <div class="tot-name" style="color:${t.color}">${t.name}</div>
      </div>
      <div class="tot-val" style="color:${t.color}">${fmtD(tot)}</div>
    </div>`;
  }).join('');

  const roundsHtml = Array.from({length:NUM_GAMES},(_,round) => {
    const players = roundPlayers(round);
    const ranked = rankPlayers(players);
    const isHidden = state.hiddenRounds[round];
    const rankBadges = ['pr1','pr2','pr3','pr4'];
    const rowsHtml = ranked.map((p, ri) => {
      return `<div class="prow">
        <div class="prow-name-money">
          <div class="prow-rank ${rankBadges[ri]}">${ri+1}</div>
          <div class="prow-name">${p.name}</div>
          <div class="prow-money" style="color:${p.teamColor}">${fmtD(p.money)}</div>
        </div>
        <div class="inp-wrap">
          <input class="ni" id="inp${p.ti}_${p.mi}" type="number" step="1" placeholder="금액">
          <span class="ni-suffix">,000</span>
          <button class="apbtn ap-p" data-act="plus" data-ti="${p.ti}" data-mi="${p.mi}">+</button>
          <button class="apbtn ap-steal" data-act="steal" data-ti="${p.ti}" data-mi="${p.mi}">뺏어오기</button>
          <button class="apbtn ap-s" data-act="set" data-ti="${p.ti}" data-mi="${p.mi}">설정</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="round-col">
      <div class="round-header">
        <div class="round-title">${roundNames[round]}</div>

        <button class="btn-toggle-round ${isHidden?'active':''}" data-round="${round}">${isHidden?'▶ 오버레이 숨김':'⊘ 오버레이 숨기기'}</button>
      </div>

    </div>`;

    ? '<div style="color:var(--muted);font-size:.78rem;text-align:center;padding:12px">거래 내역이 없습니다</div>'
    : state.log.map(l => {
        const isSet = l.mode === 'set';
        const cls = isSet ? 's' : (l.amount >= 0 ? 'p' : 'm');
        const disp = isSet ? ('→ ' + fmtD(l.after)) : ((l.amount >= 0 ? '+' : '') + fmtShort(l.amount));
        return `<div class="lrow">
          <div class="ldot" style="background:${l.color}"></div>

          <div class="lamt ${cls}">${disp}</div>

  return `<div class="wrap">

    t.members.map(m => ({ ...m, teamColor: t.color }))

      </div>
      <div class="res-card-money ${on ? '' : 'res-card-hidden'}" style="color:${on ? t.color : ''}">${on ? fmtD(t.tot) : '???'}</div>
    </div>`;
  }).join('');

  return `<div class="wrap">
    <div class="page-header">
      <div class="page-title">🎲 <span>인생게임</span> 스코어보드</div>
      <span class="badge"><span class="conn-dot"></span>Firebase 연결됨</span>
    </div>
    <div class="phase-nav">
      <div class="pnav" id="goSetup">① 팀 편성</div>
      <div class="pnav" id="goGame">② 게임 진행</div>
      <div class="pnav active">③ 결과 발표</div>
    </div>
    <div class="game-top">
      <h2>결과 발표</h2>
      <button class="btn btn-ghost btn-sm" id="btnRevealAll">전체 공개</button>
      <button class="btn btn-ghost btn-sm" id="btnHideAll">전체 숨기기</button>
    </div>
    <div class="res-section">
      <div class="res-section-label">개인 순위</div>
      <div class="res-grid-ind" style="--ind-cols:${cols}">${indCards}</div>
    </div>
    <div class="res-section">
      <div class="res-section-label">팀 순위</div>
      <div class="res-grid-team" style="grid-template-columns:repeat(3,1fr);">${teamCards}</div>
    </div>
    ${renderOvBox()}
  </div>`;
}

function renderOvBox() {
  const url = location.href.split('?')[0] + '?overlay';
  return `<div class="ov-box">
    <div class="slabel" style="margin-bottom:5px">🎬 OBS / 프릭샷 오버레이</div>
    <div class="ov-hint">아래 URL을 OBS 브라우저 소스에 붙여넣으세요. 정사각형 권장 (600×600).<br>
    Firebase 실시간 연동 — 스코어보드 수정이 즉시 반영됩니다.</div>
    <code class="ov-url" id="ovUrl">${url}</code>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="btnCopy">📋 URL 복사</button>
      <button class="btn btn-ghost btn-sm" id="btnPreview">🔗 미리보기</button>
    </div>
  </div>`;
}

function showModal(msg, buttons) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const btnsHtml = buttons.map((b,i) =>
    `<button class="btn ${b.cls||'btn-ghost'}" data-mi="${i}">${b.label}</button>`
  ).join('');
  bg.innerHTML = `<div class="modal"><div class="modal-msg">${msg}</div><div class="modal-btns">${btnsHtml}</div></div>`;
  bg.querySelectorAll('[data-mi]').forEach(el => {
    el.addEventListener('click', () => { bg.remove(); buttons[+el.dataset.mi].action?.(); });
  });
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}

// ── BIND ─────────────────────────────────────────────────────────
function bind() {
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };

  // ── 경기 배정 셀렉트 (팀 편성) ──────────────────────────────────
  if (state.phase === 'setup') {
    document.querySelectorAll('.game-slot-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        const ti = parseInt(sel.dataset.ti), mi = parseInt(sel.dataset.mi);
        const val = sel.value === '' ? null : parseInt(sel.value);
        // 같은 팀 내 중복 경기 배정 방지
        if (val !== null) {
          const conflict = state.teams[ti].members.find((m, idx) => idx !== mi && m.gameSlot === val);
          if (conflict) {
            showModal(`${conflict.name}이(가) 이미 ${['경기 1','경기 2','경기 3','경기 4'][val]}에 배정되어 있습니다.`, [{ label:'확인' }]);
            sel.value = state.teams[ti].members[mi].gameSlot !== null ? state.teams[ti].members[mi].gameSlot : '';
            return;
          }
        }
        state.teams[ti].members[mi].gameSlot = val;
        save(); render();
      });
    });
  }

  on('btnRandom', () => {
    // 각 팀의 4명을 4개 경기에 무작위로 1:1 배정
    state.teams.forEach(t => {
      const slots = [0,1,2,3];
      // Fisher-Yates 셔플
      for (let i = slots.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [slots[i],slots[j]] = [slots[j],slots[i]];
      }
      t.members.forEach((m, idx) => { m.gameSlot = slots[idx]; });
    });
    save(); render();
  });
  on('btnReset', () => showModal('경기 배정을 초기화할까요?', [
    { label:'취소' },
    { label:'초기화', cls:'btn-danger', action(){ state.teams.forEach(t => t.members.forEach(m => { m.gameSlot = null; m.money = 0; })); state.log = []; save(); render(); } }
  ]));
  on('btnStart', () => { state.phase = 'game'; state.log = []; save(); render(); });
  on('goSetup',  () => { state.phase = 'setup'; save(); render(); });
  on('goGame',   () => { state.phase = 'game'; save(); render(); });
  on('goResult', () => {
    if (!state.ended) {
      showModal('게임을 먼저 종료해야<br>결과 발표로 이동할 수 있습니다.', [{ label:'확인' }]);
      return;
    }
    state.phase = 'result'; state.revealState = { ind: Array(MEMBERS.length).fill(false), team: Array(3).fill(false) }; save(); render();
  });
  on('btnRevealAll', () => { state.revealState = { ind: Array(MEMBERS.length).fill(true), team: Array(3).fill(true) }; save(); render(); });
  on('btnHideAll',   () => { state.revealState = { ind: Array(MEMBERS.length).fill(false), team: Array(3).fill(false) }; save(); render(); });

  document.querySelectorAll('[data-rv-ind]').forEach(el => {
    el.addEventListener('click', () => {
      const ri = parseInt(el.dataset.rvInd);
      state.revealState.ind[ri] = !state.revealState.ind[ri];
      save(); render();
    });
  });
  document.querySelectorAll('[data-rv-team]').forEach(el => {
    el.addEventListener('click', () => {
      const ri = parseInt(el.dataset.rvTeam);
      state.revealState.team[ri] = !state.revealState.team[ri];
      save(); render();
    });
  });
  on('btnResetMoney', () => showModal('모든 멤버의 금액을 $0으로 초기화할까요?', [
    { label:'취소' },
    { label:'초기화', cls:'btn-danger', action(){ state.teams.forEach(t => t.members.forEach(m => m.money = 0)); state.log = []; save(); render(); } }
  ]));
  on('btnFull', () => showModal('전체 초기화하시겠습니까?<br>모든 데이터가 삭제됩니다.', [
    { label:'취소' },
    { label:'전체 초기화', cls:'btn-danger', action(){ state = defState(); modes = {}; save(); render(); } }
  ]));
  on('btnEnd',  () => showModal('게임을 종료할까요?<br>오버레이 화면이 투명하게 전환됩니다.', [
    { label:'취소' },
    { label:'게임 종료', cls:'btn-end', action(){ state.ended = true; save(); render(); } }
  ]));
  on('btnResume', () => { state.ended = false; save(); render(); });

  document.querySelectorAll('.btn-toggle-round').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const r = parseInt(el.dataset.round);
      state.hiddenRounds[r] = !state.hiddenRounds[r];
      save(); render();
    });
  });

  document.querySelectorAll('[data-mode]').forEach(el => {
    el.addEventListener('click', () => {
      const ti = parseInt(el.dataset.ti), mi = parseInt(el.dataset.mi);
      modes[ti+'_'+mi] = el.dataset.mode;
      const inp = $('inp'+ti+'_'+mi); if (inp) inp.value = '';
      render();
    });
  });

  function applyAction(ti, mi, act) {
    const inp = $('inp'+ti+'_'+mi);
    const raw = parseFloat(inp?.value) * 1000;
    if (!inp || isNaN(raw)) return;
    const m = state.teams[ti].members[mi];
    if (!m) return;
    const changes = [];
    if (act === 'steal') {
      const stealAmt = Math.round(raw);
      const round = mi;
      const others = roundPlayers(round).filter(op => op.ti !== ti);
      if (others.length === 0) { inp.value = ''; return; }
      others.forEach(op => {
        const vm = state.teams[op.ti].members[round];
        vm.money -= stealAmt;
        addLog(op.ti, vm.name, -stealAmt, vm.money, 'delta');
        changes.push({ ti: op.ti, mi: round, money: vm.money });
      });
      const gained = stealAmt * others.length;
      m.money += gained;
      addLog(ti, m.name, gained, m.money, 'steal');
      changes.push({ ti, mi, money: m.money });
    } else {
      let amount, mode;
      if (act === 'set') {
        const v = Math.round(raw); amount = v - m.money; m.money = v; mode = 'set';
      } else {
        const delta = Math.round(raw) * (act === 'plus' ? 1 : -1);
        m.money += delta; amount = delta; mode = 'delta';
      }
      addLog(ti, m.name, amount, m.money, mode);
      changes.push({ ti, mi, money: m.money });
    }
    inp.value = ''; saveMoney(); render();
  }

  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      applyAction(parseInt(el.dataset.ti), parseInt(el.dataset.mi), el.dataset.act);
    });
  });

  document.querySelectorAll('.ni').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inp.id.startsWith('batch')) {
        const round = parseInt(inp.id.replace('batch',''));
        document.querySelector(`[data-batch="${round}"][data-batch-act="plus"]`)?.click();
      } else {
        const [ti, mi] = inp.id.replace('inp','').split('_').map(Number);
        applyAction(ti, mi, 'plus');
      }
    });
  });

  // 경기별 전원 일괄 적용
  document.querySelectorAll('[data-batch]').forEach(el => {
    el.addEventListener('click', () => {
      const round = parseInt(el.dataset.batch);
      const act = el.dataset.batchAct;
      const inp = $('batch' + round);
      const raw = parseFloat(inp?.value) * 1000;
      if (!inp || isNaN(raw)) return;
      const delta = Math.round(raw) * (act === 'plus' ? 1 : -1);
      const changes = [];
      roundPlayers(round).forEach(p => {
        const vm = state.teams[p.ti].members[p.mi];
        vm.money += delta;
        addLog(p.ti, vm.name, delta, vm.money, 'delta');
        changes.push({ ti: p.ti, mi: p.mi, money: vm.money });
      });
      inp.value = ''; saveMoney(); render();
    });
  });

  on('btnCopy', () => {
    const url = $('ovUrl')?.textContent;
    navigator.clipboard?.writeText(url).then(() => {
      const b = $('btnCopy'); if (b) { b.textContent = '✅ 복사됨'; setTimeout(() => b.textContent = '📋 URL 복사', 1500); }
    });
  });
  on('btnPreview', () => { window.open($('ovUrl')?.textContent, '_blank', 'width=380,height=320'); });
}

// ── OVERLAY ──────────────────────────────────────────────────────
function renderOverlay() {
  document.body.classList.add('ovm');
  const app = document.getElementById('app');
  const activeRounds = Array.from({length:NUM_GAMES},(_,r)=>r).filter(r => roundPlayers(r).length > 0);
  const allHidden = activeRounds.length > 0 && activeRounds.every(r => state.hiddenRounds[r]);
  if (allHidden) {
    if (ovTimer) { clearInterval(ovTimer); ovTimer = null; }
    app.innerHTML = '';
    return;
  }
  const rkBg  = {1:'#FFD700',2:'#B8B8B8',3:'#CD7F32',4:'#3a3a3a'};
  const rkTxt = {1:'#000',  2:'#000',  3:'#fff',  4:'#fff'};

  if (state.ended || state.phase === 'result') {
    if (ovTimer) { clearInterval(ovTimer); ovTimer = null; }
    app.innerHTML = '';
    return;
  }

  const roundNames = ['경기 1','경기 2','경기 3','경기 4'];
  if (ovCurrent > NUM_GAMES-1) ovCurrent = 0;

  const panelsHtml = Array.from({length:NUM_GAMES},(_,round) => {
    const ranked = rankPlayers(roundPlayers(round));
    const isHidden = state.hiddenRounds[round];
    const rowsHtml = ranked.map((p, ri) => {
      const key = `${p.ti}_${p.mi}`;
      const oldMoney = prevOverlayMoney[key];
      const changed = oldMoney !== undefined && oldMoney !== p.money;
      const arrowHtml = changed
        ? `<span class="ov-arrow ${p.money > oldMoney ? 'ov-arrow-up' : 'ov-arrow-dn'}">${p.money > oldMoney ? '▲' : '▼'}</span>`
        : '';
      const moneyHtml = isHidden
        ? `<div class="ov-pmoney" style="color:rgba(255,255,255,.15)">?</div>`
        : `<div class="ov-pmoney">${arrowHtml}${fmtFlip(p.money, oldMoney, p.teamColor)}</div>`;
      prevOverlayMoney[key] = p.money;
      return `<div class="ov-prow" style="border-left-color:${p.teamColor}">
        <div class="ov-rnum ovr${ri+1}" style="background:${rkBg[ri+1]};color:${rkTxt[ri+1]}">${ri+1}</div>
        <div class="ov-info"><div class="ov-pname" style="color:#fff">${p.name}</div></div>
        ${moneyHtml}
      </div>`;
    }).join('');
    const hiddenOverlay = isHidden ? `<div class="ov-msg-overlay">인생의 황혼기에<br>진입했습니다</div>` : '';
    return `<div class="ov-panel" id="ovp${round}" style="position:relative">${rowsHtml}${hiddenOverlay}</div>`;
  }).join('');

  app.innerHTML = `<div class="ov-stage">${panelsHtml}</div>`;

  // 애니메이션 종료 후 flip 클래스 제거 (패널 전환 시 재실행 방지)
  setTimeout(() => {
    document.querySelectorAll('.fd-old-up, .fd-old-dn').forEach(el => el.remove());
    document.querySelectorAll('.fd-new-up, .fd-new-dn').forEach(el => {
      el.classList.remove('fd-new-up', 'fd-new-dn');
    });
  }, 400);

  showOvPanel(ovCurrent);
  startOvTimer();
}

function showOvPanel(roundIdx) {
  document.querySelectorAll('.ov-panel').forEach(p => p.classList.remove('visible'));
  const target = document.getElementById('ovp' + roundIdx);
  if (target) target.classList.add('visible');
}

function startOvTimer() {
  if (ovTimer) clearInterval(ovTimer);
  const activeRounds = Array.from({length:NUM_GAMES},(_,r)=>r).filter(r => roundPlayers(r).length > 0);
  if (activeRounds.length === 0) return;
  // 현재 ovCurrent가 유효한 경기인지 확인
  if (!activeRounds.includes(ovCurrent)) ovCurrent = activeRounds[0];
  ovTimer = setInterval(() => {
    const rounds = Array.from({length:NUM_GAMES},(_,r)=>r).filter(r => roundPlayers(r).length > 0);
    if (rounds.length === 0) return;
    const idx = rounds.indexOf(ovCurrent);
    ovCurrent = rounds[(idx + 1) % rounds.length];
    showOvPanel(ovCurrent);
  }, 10000);
}

// ── FIREBASE LISTENER ────────────────────────────────────────────
STATE_REF.on('value', snapshot => {
  const raw = snapshot.val();

  // 멤버 불일치: 옛 멤버 데이터는 항상 무시 (Firebase에 쓰지 않음)
  if (raw) {
    const rawNames = [];
    if (Array.isArray(raw.teams)) raw.teams.forEach(t => {
      const members = Array.isArray(t.members) ? t.members : (t.members ? Object.values(t.members) : []);
      members.forEach(m => { if (m && m.name) rawNames.push(m.name); });
    });
    if (rawNames.length > 0 && !rawNames.every(n => MEMBERS.includes(n))) {
      if (state === null) {
        state = defState();
        save();
        if (isOv) renderOverlay(); else render();
      }
      return;
    }
  }

  const incoming = sanitize(raw);

  // Firebase가 비어있으면 초기 데이터 저장
  if (!raw && state === null) {
    state = incoming;
    save();
    if (isOv) renderOverlay(); else render();
    return;
  }

  if (!isOv && state !== null && incoming.updatedAt === myLastSave) return;

  if (isOv && state !== null && !incoming.ended && incoming.phase === 'game') {
    // 변동된 경기(round) 감지: gameSlot 기준으로 money 비교
    let changedRound = -1;
    outer: for (let ti = 0; ti < incoming.teams.length; ti++) {
      const newT = incoming.teams[ti], oldT = state.teams[ti];
      if (!newT || !oldT) continue;
      for (let mi = 0; mi < newT.members.length; mi++) {
        const nm = newT.members[mi], om = oldT.members[mi];
        if (nm && om && nm.money !== om.money && nm.gameSlot !== null) {
          changedRound = nm.gameSlot; break outer;
        }
      }
    }
    if (changedRound !== -1 && changedRound !== ovCurrent && roundPlayers(changedRound).length > 0) {
      ovCurrent = changedRound;
      state = incoming;
      renderOverlay();   // DOM 재생성 후
      startOvTimer();    // 타이머 리셋 (10초 새로 시작)
      return;
    }
  }

  state = incoming;

  if (isOv) {
    renderOverlay();
  } else {
    // 입력 중인 값 보존
    const saved = {};
    document.querySelectorAll('.ni').forEach(el => { if (el.value) saved[el.id] = el.value; });
    render();
    // 입력값 복원
    Object.entries(saved).forEach(([id, val]) => {
      const el = document.getElementById(id);
      if (el) { el.value = val; }
    });
  }
}, error => {
  console.error('Firebase error:', error);
  document.getElementById('app').innerHTML =
    '<div class="loading"><div style="color:#FF4757">Firebase 연결 실패</div><div style="font-size:.8rem;color:var(--muted)">' + error.message + '</div></div>';
});
</script>
